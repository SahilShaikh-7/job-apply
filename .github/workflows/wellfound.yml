name: Wellfound Auto Apply

on:
  workflow_dispatch:

jobs:
  wellfound:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Verify Chrome
        run: |
          google-chrome --version
          node --version
          npm --version

      - name: Run Wellfound automation - DRY RUN
        env:
          NAME: ${{ secrets.NAME }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          LOCATION: ${{ secrets.LOCATION }}
          CURRENT_ROLE: ${{ secrets.CURRENT_ROLE }}
          COMPANY: ${{ secrets.COMPANY }}
          EDUCATION: ${{ secrets.EDUCATION }}
          YEARS_EXPERIENCE: ${{ secrets.YEARS_EXPERIENCE }}
          SKILLS: ${{ secrets.SKILLS }}
          HIGHLIGHTS: ${{ secrets.HIGHLIGHTS }}
          NOTICE_PERIOD: ${{ secrets.NOTICE_PERIOD }}
          CURRENT_CTC: ${{ secrets.CURRENT_CTC }}
          EXPECTED_CTC: ${{ secrets.EXPECTED_CTC }}
          DOB: ${{ secrets.DOB }}
          GENDER: ${{ secrets.GENDER }}
          WORK_AUTH: ${{ secrets.WORK_AUTH }}
          GITHUB_URL: ${{ secrets.GITHUB_URL }}
          LINKEDIN_URL: ${{ secrets.LINKEDIN_URL }}
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            node auto-apply-runner.js wellfound
